<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ressources · Français · Bridging21</title>
<meta name="description" content="French grammar, vocabulary, songs and music resources from Bridging21.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body class="theme-tenses">
<header class="topbar">
  <a class="back" href="./">← Accueil</a>
</header>
<h1 class="page-title">Ressources</h1>
<p class="page-sub">Grammar, vocabulary, songs and more. Links open on bridging21.com.</p>

<nav class="res-jump" id="jump" aria-label="Sections"></nav>
<main class="res" id="res"></main>

<script>
  // To add a resource: add a line to the right section. kind = a short label.
  const B21 = "https://www.bridging21.com";
  const SECTIONS = [
    {
      id: "grammaire", title: "Grammaire", emoji: "✏️", color: "var(--c-verb)",
      items: [
        { t: "Dr. Mrs. Vandertrampp", d: "Remember the verbs that take être in the passé composé", kind: "Memory aid", url: "/dr-mrs-vandertrampp/" },
        { t: "L’hôpital « d’être »", d: "Les verbes qui se conjuguent avec être au passé composé", kind: "Printable", url: "/hopital-detre/" },
        { t: "Quel auxiliaire ?", d: "Avoir ou être ? Glisser chaque verbe dans la bonne colonne", kind: "Activity", url: "/quel-auxiliaire/" },
        { t: "Participes passés irréguliers", d: "A game for irregular past participles", kind: "Game", url: "/participes-passes-irreguliers-jeu/" },
        { t: "Qui, que, ce qui, ce que", d: "Infographics for relative pronouns", kind: "Infographic", url: "/qui-que-ce-qui-ce-que/" },
        { t: "Est-ce que… ?", d: "Asking questions", kind: "Grammar", url: "/est-ce-que/" },
        { t: "Amener, apporter, emmener, emporter", d: "Which one do I use?", kind: "Grammar", url: "/a-em-porter-mener/" },
        { t: "Adverbes de fréquence", d: "Toujours, souvent, parfois, jamais…", kind: "Grammar", url: "/adverbes-de-frequence/" }
      ]
    },
    {
      id: "vocabulaire", title: "Vocabulaire", emoji: "🗂️", color: "var(--c-tense)",
      items: [
        { t: "Les couleurs", d: "Apprendre les couleurs : crosswords, lists and more", kind: "Worksheets", url: "/les-couleurs/" },
        { t: "Couleurs individuelles", d: "High-resolution colour cards to print", kind: "PDF", url: "/couleurs-individuelles/" },
        { t: "Les vêtements", d: "Talking about clothes: wheel and foldable", kind: "Worksheets", url: "/les-vetements/" },
        { t: "La trousse", d: "Pencil-case vocabulary: writing, foldable and colouring", kind: "Worksheets", url: "/la-trousse/" },
        { t: "Le corps humain", d: "Parts of the body: flashcards and activities", kind: "Flashcards", url: "/le-corps-humain/" },
        { t: "Les grands monuments", d: "Speaking, listening and reading about famous monuments", kind: "Activity", url: "/les-grands-monuments/" },
        { t: "Instruments FR–EN", d: "The instruments of the orchestra in French", kind: "Vocabulary", url: "/instruments-fr-en/" },
        { t: "Bataille navale", d: "Battleship templates for practising any vocabulary", kind: "Game", url: "/battleship-bataille-navale/" }
      ]
    },
    {
      id: "chansons", title: "Chansons", emoji: "🎵", color: "var(--c-pronoun)",
      items: [
        { t: "Les chiffres et les nombres de 1 à 10", d: "Counting song by Alain le Lait", kind: "Song", url: "/songs-for-learning/song/les-chiffres-et-les-nombres-de-1-a-10/" },
        { t: "Arc-en-ciel", d: "The colours, by Alain le Lait", kind: "Song", url: "/songs-for-learning/song/arc-en-ciel-par-alain-le-lait/" },
        { t: "Alain le Lait playlist", d: "Funny, catchy songs for learning French", kind: "Playlist", url: "/alain-le-lait-playlist/" }
      ]
    },
    {
      id: "musique", title: "Musique en français", emoji: "🎻", color: "var(--c-super)",
      items: [
        { t: "L’orchestre", d: "Les instruments de l’orchestre : noms, sons et familles", kind: "Course", url: "/courses/l-orchestre/" },
        { t: "Le Carnaval des animaux", d: "Saint-Saëns’ musical zoo", kind: "Course", url: "/courses/carnaval-des-animaux/" },
        { t: "La comédie musicale", d: "Musicals, in French and English", kind: "Course", url: "/courses/musicals-la-comedie-musicale/" },
        { t: "Les familles d’instruments", d: "Glisser, déposer : sort the instruments into families", kind: "Activity", url: "/les-familles-dinstruments-glisser-deposer/" }
      ]
    },
    {
      id: "college", title: "Leçons de musique (collège)", emoji: "🎼", color: "#f15bb5",
      items: [
        { t: "Peut-on jouer avec le temps ?", d: "Music lesson in French", kind: "6e", url: "/peut-on-jouer-avec-le-temps-6e/" },
        { t: "La musique peut-elle créer du mouvement ?", d: "Music lesson in French", kind: "6e", url: "/la-musique-peut-elle-creer-du-mouvement/" },
        { t: "Les chansons de dessins animés nous apprennent-elles des leçons de vie ?", d: "Music lesson in French", kind: "6e", url: "/les-chansons-de-dessins-animes-nous-apprennent-t-elles-des-lecons-de-vie-6e/" },
        { t: "Les instruments traditionnels sont-ils condamnés au profit des instruments numériques ?", d: "Music lesson in French", kind: "6e", url: "/les-instruments-de-musiques-traditionnels-sont-ils-condamnes-au-profit-des-instruments-numeriques-6e/" },
        { t: "Quelles sont les recettes typiques de la musique de super-héros ?", d: "Music lesson in French", kind: "5e", url: "/quelles-sont-les-recettes-typiques-de-la-musique-de-super-heros-5e/" },
        { t: "Le visuel aide-t-il à entendre ?", d: "Music lesson in French", kind: "5e", url: "/le-visuel-aide-t-il-a-entendre-5e/" },
        { t: "Une même œuvre peut-elle sonner différemment ?", d: "Music lesson in French", kind: "5e", url: "/une-meme-oeuvre-peut-elle-sonner-differemment/" },
        { t: "Notre oreille est-elle sélective ?", d: "Music lesson in French", kind: "5e", url: "/notre-oreille-est-elle-selective-5e/" },
        { t: "Peut-on exprimer les émotions sans avoir recours au sens des mots ?", d: "Music lesson in French", kind: "4e", url: "/peut-on-exprimer-les-emotions-sans-avoir-recours-au-sens-des-mots-4e/" },
        { t: "L’amplification du son aide-t-elle à mieux entendre ?", d: "Music lesson in French", kind: "4e", url: "/lamplification-du-son-aide-t-elle-a-mieux-entendre-4e/" },
        { t: "Le jazz est-il un style facilement identifiable ?", d: "Music lesson in French", kind: "Collège", url: "/le-jazz-est-il-un-style-facilement-identifiable/" },
        { t: "Mon univers vocal", d: "Music lesson in French", kind: "Collège", url: "/mon-univers-vocal/" }
      ]
    }
  ];

  const jump = document.getElementById("jump");
  const res = document.getElementById("res");
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };

  SECTIONS.forEach(sec => {
    const a = el("a", "res-chip", `${sec.emoji} ${sec.title}`);
    a.href = "#" + sec.id;
    jump.appendChild(a);

    const s = el("section", "res-section");
    s.id = sec.id;
    s.style.setProperty("--c", sec.color);
    const h = el("h2", "res-h");
    h.append(el("span", "res-h-emoji", sec.emoji), sec.title, el("span", "res-count", String(sec.items.length)));
    s.appendChild(h);

    const list = el("div", "res-list");
    sec.items.forEach(it => {
      const row = el("a", "res-item");
      row.href = B21 + it.url;
      row.target = "_blank";
      row.rel = "noopener";
      const txt = el("div", "res-text");
      const title = el("div", "res-title", it.t);
      title.lang = "fr";
      txt.append(title, el("div", "res-desc", it.d));
      row.append(txt, el("span", "res-kind", it.kind), el("span", "res-arrow", "↗"));
      list.appendChild(row);
    });
    s.appendChild(list);
    res.appendChild(s);
  });
</script>
</body>
</html>
